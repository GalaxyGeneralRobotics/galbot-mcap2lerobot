name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # The merge path depends only on numpy/pandas/pyarrow/termcolor/tqdm,
        # so the regression tests run without lerobot, mcap or ffmpeg.
        run: pip install numpy pandas pyarrow termcolor tqdm pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -v
